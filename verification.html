<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Cuenta Verificada! - Lukes English Academy</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Afacad+Flux:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Mismos colores neutros y mate de Lukes Academy -->
    <style>
        :root {
            --bg-main: #efebd9;
            --bg-card: #f8f5ea;
            --bg-subcard: #e5dfcb;
            --text-main: #1d2522;
            --text-muted: #646e68;
            --border-color: #d1c9b0;
            --accent-orange: #d96245;
            --accent-green: #23483f;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Afacad Flux', 'Segoe UI', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        .success-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            text-align: center;
            max-width: 440px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            max-width: 180px;
            height: auto;
            margin-bottom: 10px;
        }

        .icon-check {
            font-size: 52px;
            color: var(--accent-green);
        }

        h1 {
            font-family: 'Comfortaa', cursive;
            margin: 0;
            font-size: 22px;
            font-weight: 900;
            color: var(--accent-green);
            text-transform: uppercase;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin: 0;
            font-weight: 600;
        }

        .btn-return {
            display: inline-block;
            margin-top: 15px;
            padding: 14px 32px;
            background-color: var(--accent-orange);
            color: white;
            text-decoration: none;
            border-radius: 16px;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(217, 98, 69, 0.25);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-return:hover {
            transform: scale(1.03);
            background-color: #c8533b;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <!-- Logo de la Academia -->
        <img src="assets/lukes-academy-logo.svg" class="logo-img" alt="Lukes English Academy">
        
        <i class="fa-solid fa-circle-check icon-check"></i>
        <h1>¡Correo Confirmado!</h1>
        <p>Tu cuenta ha sido activada con éxito. Ya puedes volver a la aplicación e iniciar sesión para comenzar tus lecciones.</p>
        
        <!-- Enlace de regreso directo a GitHub Pages -->
        <a href="https://rgadeat0212.github.io/lukes.vocabulary/" class="btn-return">
            Ingresar a la Plataforma ➔
        </a>
    </div>
</body>
</html>
