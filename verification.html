<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirma tu cuenta - Lukes English Academy</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8f6f0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #2d312e;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="table-layout: fixed;">
        <tr>
            <td align="center" style="padding: 40px 10px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 520px; background-color: #ffffff; border-radius: 24px; border: 1px solid #e5e0d8; box-shadow: 0 10px 25px rgba(0,0,0,0.03); overflow: hidden;">
                    <!-- Header -->
                    <tr>
                        <td align="center" style="padding: 32px 30px 20px 30px; background-color: #2b3a35;">
                            <h1 style="margin: 0; font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px;">lukes</h1>
                            <p style="margin: 4px 0 0 0; font-size: 10px; font-weight: 700; color: #d4a373; text-transform: uppercase; letter-spacing: 2px;">ENGLISH ACADEMY</p>
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding: 35px 32px; text-align: center;">
                            <h2 style="margin: 0 0 12px 0; font-size: 20px; font-weight: 700; color: #1c2321;">¡Bienvenido a bordo! 🚀</h2>
                            <p style="margin: 0 0 24px 0; font-size: 14px; line-height: 1.6; color: #525b56;">
                                Gracias por registrarte. Haz clic en el siguiente botón para confirmar tu correo electrónico y activar tu cuenta en la plataforma:
                            </p>
                            <a href="{{ .ConfirmationURL }}" target="_blank" style="display: inline-block; background-color: #d97757; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 14px 32px; border-radius: 14px; box-shadow: 0 4px 12px rgba(217, 119, 87, 0.25);">
                                Confirmar mi Cuenta ➔
                            </a>
                            <p style="margin: 28px 0 0 0; font-size: 11px; color: #8a938e;">
                                Si no creaste esta cuenta, puedes ignorar este correo con total tranquilidad.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
