<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   version="1.1"
   id="svg1"
   width="303"
   height="303"
   viewBox="0 0 303 303"
   xml:space="preserve"
   xmlns="http://www.w3.org/2000/svg">
  
  <defs id="defs1">
    <style type="text/css">
      /* ⏱️ CICLO TOTAL: 3.5 Segundos */

      /* 🔤 1. TYPING DE LETRAS "LUKES" */
      .anim-letra {
        opacity: 0;
        transform: translateY(4px);
        stroke-linejoin: round;
        animation: escribirLetra 3.5s cubic-bezier(0.175, 0.885, 0.32, 1.25) infinite;
      }

      @keyframes escribirLetra {
        0%, 10% {
          opacity: 0;
          transform: translateY(4px);
        }
        30%, 90% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(4px);
        }
      }

      /* Delays sincronizados letra por letra */
      .letra-l { animation-delay: 0.00s; }
      .letra-u { animation-delay: 0.10s; }
      .letra-k { animation-delay: 0.20s; }
      .letra-e { animation-delay: 0.30s; }
      .letra-s { animation-delay: 0.40s; }

      /* 🐾 2. ESTAMPADO DE PATITAS EN LA U */
      .anim-patita {
        opacity: 0;
        animation: estampar 3.5s cubic-bezier(0.175, 0.885, 0.32, 1.35) infinite;
      }

      .patita-izq {
        transform-origin: 102px 156px;
        animation-delay: 0.25s;
      }

      .patita-der {
        transform-origin: 118px 157px;
        animation-delay: 0.35s;
      }

      @keyframes estampar {
        0%, 25% {
          opacity: 0;
          transform: scale(2.2);
        }
        40%, 90% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(2.2);
        }
      }

      /* ✍️ 3. EFECTO DE ESCRITURA PARA "English Academy" */
      .text-container {
        /* Define la máscara que simula el trazo escribiéndose */
        mask: url(#text-mask);
      }

      .mask-rect {
        width: 0px;
        animation: escribirTexto 3.5s ease-out infinite;
        animation-delay: 0.55s; /* Comienza justo cuando termina LUKES */
      }

      @keyframes escribirTexto {
        0%, 15% {
          width: 0px;
        }
        45%, 90% {
          width: 200px; /* Revela todo el texto */
        }
        100% {
          width: 0px;
        }
      }

      .academy-text {
        font-family: 'Fredoka', Arial, sans-serif;
        font-size: 13px;
        font-weight: 800;
        fill: #d97757; /* Naranja vibrante */
        letter-spacing: 1.5px;
      }
    </style>

    <!-- Máscara de revelado progresivo -->
    <mask id="text-mask">
      <rect class="mask-rect" x="50" y="200" height="30" fill="white" />
    </mask>
  </defs>

