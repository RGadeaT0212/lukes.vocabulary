<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lukes English Academy - VocabApp</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Afacad+Flux:wght@400;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- SDK SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- HOJA DE ESTILOS CENTRALIZADA -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans h-screen w-screen flex flex-col md:flex-row select-none app-bg text-main overflow-hidden">

    <!-- 0. SPLASH SCREEN DE CARGA -->
    <div id="app-splash-screen" class="fixed inset-0 app-bg z-50 flex flex-col items-center justify-center pointer-events-auto splash-morph">
        <div class="relative w-56 h-56 sm:w-64 sm:h-64 flex items-center justify-center">
            <img src="assets/lukes-academy-logo.svg" id="splash-logo-img" class="w-full h-full object-contain" alt="Lukes English Academy">
        </div>
        <span class="text-xs font-mono font-bold text-muted uppercase tracking-widest mt-4 animate-pulse">// CARGANDO PLATAFORMA...</span>
    </div>

    <!-- NOTIFICACIONES TOAST -->
    <div id="luke-alert-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- 1. NAVEGACIÓN LATERAL (DESKTOP) -->
    <aside class="hidden md:flex md:w-64 card-bg border-r border-main flex-col justify-between p-5 shrink-0 z-40 transition-colors">
        <div class="flex flex-col gap-5">
            <div class="flex items-center justify-center w-full px-2 py-1">
                <img src="assets/lukes-academy-logo.svg" class="w-full max-w-[190px] h-auto object-contain transition-transform hover:scale-105" alt="Lukes English Academy">
            </div>

            <!-- IDIOMA ACTIVO -->
            <div class="flex items-center justify-between subcard-bg px-3 py-2 rounded-xl border border-main text-xs font-mono font-bold">
                <div class="flex items-center gap-2">
                    <span class="text-base">🇺🇸</span>
                    <span class="text-[10px] text-main uppercase">Aprendiendo</span>
                </div>
                <span class="text-[10px] font-bold text-[#e06a4e]">Inglés</span>
            </div>

            <nav class="flex flex-col gap-1.5">
                <button onclick="window.location.reload()" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-[#23483f] text-white font-bold text-xs uppercase tracking-wider shadow-xs cursor-pointer w-full text-left">
                    <i class="fa-solid fa-house text-sm"></i>
                    <span>Inicio</span>
                </button>
                <button onclick="window.openSpeakingManager()" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-muted font-bold text-xs uppercase tracking-wider transition-all cursor-pointer w-full text-left">
                    <i class="fa-solid fa-microphone text-sm"></i>
                    <span>Speaking</span>
                </button>
                <button onclick="window.openMissionsManager()" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-muted font-bold text-xs uppercase tracking-wider transition-all cursor-pointer w-full text-left">
                    <i class="fa-solid fa-bullseye text-sm"></i>
                    <span>Misiones</span>
                </button>
                <button onclick="window.openChallengesManager()" class="nav-btn flex items-center gap-3 px-4 py-3 rounded-xl text-muted font-bold text-xs uppercase tracking-wider transition-all cursor-pointer w-full text-left">
                    <i class="fa-solid fa-gamepad text-sm"></i>
                    <span>Desafíos</span>
                </button>
            </nav>
        </div>

        <div class="border-t border-main pt-4 flex flex-col gap-3">
            <div class="flex items-center justify-between subcard-bg p-2 rounded-xl border border-main">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-moon text-xs text-main"></i>
                    <span class="text-[10px] font-mono font-bold text-main">MODO OSCURO</span>
                </div>
                <button onclick="window.toggleDarkMode()" class="w-9 h-5 bg-[#e3dec3] dark:bg-[#e06a4e] rounded-full p-0.5 transition-colors cursor-pointer flex items-center">
                    <div class="w-4 h-4 bg-white rounded-full shadow-xs transform dark:translate-x-4 transition-transform"></div>
                </button>
            </div>

            <div id="guest-auth-actions" class="flex flex-col gap-2">
                <button onclick="window.openAuthModal('login')" class="w-full bg-[#23483f] hover:bg-[#19322b] text-white font-mono text-xs font-bold py-2.5 rounded-xl uppercase tracking-wider cursor-pointer transition-all shadow-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket text-xs"></i>
                    <span>Iniciar Sesión</span>
                </button>
                <button onclick="window.openAuthModal('register')" class="w-full bg-[#e06a4e] hover:bg-[#c8573b] text-white font-mono text-xs font-bold py-2.5 rounded-xl uppercase tracking-wider cursor-pointer transition-all shadow-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus text-xs"></i>
                    <span>Registrarse</span>
                </button>
            </div>

            <div id="logged-user-actions" class="hidden flex flex-col gap-2">
                <div class="flex items-center justify-between subcard-bg p-2 rounded-xl border border-main">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-full bg-[#e06a4e] text-white font-bold text-xs flex items-center justify-center shadow-xs">
                            <i class="fa-solid fa-user text-xs"></i>
                        </div>
                        <div class="flex flex-col">
                            <span id="student-name-display" class="text-xs font-bold text-main truncate max-w-[85px]">Estudiante</span>
                            <span class="text-[8px] font-bold text-[#e06a4e]">🐾 <span id="header-coins-display">0</span> PATITAS</span>
                        </div>
                    </div>
                    <button onclick="window.MissionsEngine.renderLukesGoldCardModal()" class="text-[8px] bg-gradient-to-r from-amber-400 to-amber-600 text-stone-900 font-black px-2 py-1 rounded-lg uppercase shadow-xs">
                        💳
                    </button>
                </div>
                <button id="logout-btn" onclick="window.handleLogout()" class="w-full text-rose-600 bg-rose-50 dark:bg-rose-950/30 hover:bg-rose-100 py-1.5 rounded-xl font-mono text-[10px] font-bold uppercase transition-all cursor-pointer flex items-center justify-center gap-1">
                    <i class="fa-solid fa-power-off text-xs"></i>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- HEADER MÓVIL (ESTÁTICO FUERA DEL ÁREA SCROLL) -->
    <header class="md:hidden w-full card-bg border-b border-main px-4 py-2 flex items-center justify-between shadow-xs shrink-0 z-30 transition-colors">
        <div class="flex items-center">
            <!-- LOGO MÓVIL AMPLIFICADO (h-11) -->
            <img src="assets/lukes-academy-logo.svg" class="h-11 sm:h-12 w-auto object-contain" alt="Lukes English Academy">
        </div>

        <div class="flex items-center gap-2">
            <div class="flex items-center gap-1 text-[11px] font-bold text-[#e06a4e] subcard-bg px-2.5 py-1 rounded-full border border-main">
                <span>🐾</span>
                <span id="mobile-coins-display">0</span>
            </div>
            
            <div id="mobile-auth-guest-btns" class="flex gap-1">
                <button onclick="window.openAuthModal('login')" class="text-[9px] font-mono font-bold text-white bg-[#23483f] px-2.5 py-1.5 rounded-lg uppercase">
                    Entrar
                </button>
                <button onclick="window.openAuthModal('register')" class="text-[9px] font-mono font-bold text-white bg-[#e06a4e] px-2.5 py-1.5 rounded-lg uppercase">
                    Registro
                </button>
            </div>
            
            <button id="mobile-auth-user-btn" onclick="window.toggleBottomSheetProfile()" class="hidden text-[10px] font-bold text-main truncate max-w-[85px] subcard-bg px-2.5 py-1 rounded-lg border border-main">
                <span id="mobile-name-display">Estudiante</span>
            </button>
        </div>
    </header>

    <!-- 2. CONTENEDOR PRINCIPAL CON SCROLL INDEPENDIENTE EN MÓVIL -->
    <main class="flex-1 overflow-y-auto md:overflow-hidden w-full p-3 sm:p-5 flex flex-col justify-between gap-4 max-w-5xl mx-auto md:mx-0 md:pr-12 custom-scrollbar">

        <!-- CARRUSEL PUBLICITARIO -->
        <section class="w-full card-bg rounded-2xl sm:rounded-3xl border border-main shadow-xs p-2 sm:p-3 shrink-0 h-28 sm:h-36 flex items-center justify-center overflow-hidden relative transition-colors">
            <div class="w-full h-full rounded-xl sm:rounded-2xl border border-main subcard-bg overflow-hidden relative">
                <div id="carousel-track" class="w-full h-full flex transition-transform duration-500 ease-out"></div>
                <div id="carousel-dots" class="absolute bottom-2 left-1/2 -translate-x-1/2 flex gap-1.5 z-10"></div>
            </div>
        </section>

        <!-- MÓDULO INTEGRADO DE BURBUJAS -->
        <section class="w-full card-bg border border-main rounded-2xl sm:rounded-3xl p-3.5 sm:p-5 shadow-xs flex flex-col gap-3 transition-colors">
            <div class="w-full flex justify-between items-center border-b border-main pb-2">
                <div class="flex items-center gap-2">
                    <span class="text-[9px] font-mono font-bold text-muted uppercase">// TEMA ACTUAL:</span>
                    <h3 id="home-category-title" class="title-brand font-black text-sm sm:text-lg text-main uppercase tracking-tight">EXPRESSIONS</h3>
                </div>

                <div class="flex items-center gap-1.5">
                    <span id="home-level-badge" class="px-3 py-1 rounded-xl bg-[#e06a4e] text-white font-mono text-xs font-black uppercase tracking-wider">A1</span>
                </div>
            </div>

            <!-- ACORDEÓN DE PALABRAS -->
            <div class="w-full">
                <button onclick="window.toggleWordPreviewAccordion()" class="text-[10px] font-mono font-bold text-muted hover:text-[#e06a4e] flex items-center gap-1 cursor-pointer transition-colors">
                    <span>👁️ Ver las 5 palabras de esta lección</span>
                    <i id="preview-chevron" class="fa-solid fa-chevron-down text-[8px] transition-transform"></i>
                </button>
                <div id="word-preview-accordion" class="hidden grid grid-cols-2 sm:grid-cols-5 gap-1.5 mt-2 subcard-bg p-2 rounded-xl border border-main"></div>
            </div>

            <!-- TIRA CONTINUA DE BURBUJAS AMPLIFICADAS -->
            <div class="w-full h-24 sm:h-32 flex items-center justify-center relative overflow-hidden my-1">
                <button onclick="window.moveHomeCarousel(-1)" class="absolute left-1 z-20 w-9 h-9 sm:w-10 sm:h-10 rounded-full card-bg border border-main shadow-md flex items-center justify-center text-xs sm:text-sm text-main cursor-pointer active:scale-95">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>

                <div id="home-bubbles-track" class="flex items-center gap-5 sm:gap-10 transition-transform duration-500 ease-out absolute left-1/2"></div>

                <button onclick="window.moveHomeCarousel(1)" class="absolute right-1 z-20 w-9 h-9 sm:w-10 sm:h-10 rounded-full card-bg border border-main shadow-md flex items-center justify-center text-xs sm:text-sm text-main cursor-pointer active:scale-95">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </section>

        <!-- MÓDULOS DE PRÁCTICA COMPACTOS HORIZONTALES -->
        <section class="grid grid-cols-3 gap-2 sm:gap-4 w-full shrink-0">
            <div onclick="window.openSpeakingManager()"
                 class="card-bg card-hover border border-main border-b-4 border-b-[#e06a4e] rounded-xl sm:rounded-2xl p-2 sm:px-4 sm:py-2.5 h-12 sm:h-14 flex items-center justify-center gap-2 sm:gap-3 shadow-xs cursor-pointer transition-all active:translate-y-0.5">
                <div class="w-6 h-6 sm:w-8 sm:h-8 subcard-bg rounded-lg flex items-center justify-center text-[#e06a4e] text-xs sm:text-sm shrink-0 border border-main">
                    <i class="fa-solid fa-microphone"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-bold text-main uppercase tracking-wider">Speaking</span>
            </div>

            <div onclick="window.openMissionsManager()" 
                 class="card-bg card-hover border border-main border-b-4 border-b-[#23483f] rounded-xl sm:rounded-2xl p-2 sm:px-4 sm:py-2.5 h-12 sm:h-14 flex items-center justify-center gap-2 sm:gap-3 shadow-xs cursor-pointer transition-all active:translate-y-0.5">
                <div class="w-6 h-6 sm:w-8 sm:h-8 subcard-bg rounded-lg flex items-center justify-center text-[#23483f] dark:text-[#8b9690] text-xs sm:text-sm shrink-0 border border-main">
                    <i class="fa-solid fa-bullseye"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-bold text-main uppercase tracking-wider">Misiones</span>
            </div>

            <div onclick="window.openChallengesManager()" 
                 class="card-bg card-hover border border-main border-b-4 border-b-[#d4a373] rounded-xl sm:rounded-2xl p-2 sm:px-4 sm:py-2.5 h-12 sm:h-14 flex items-center justify-center gap-2 sm:gap-3 shadow-xs cursor-pointer transition-all active:translate-y-0.5">
                <div class="w-6 h-6 sm:w-8 sm:h-8 subcard-bg rounded-lg flex items-center justify-center text-[#d4a373] text-xs sm:text-sm shrink-0 border border-main">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <span class="text-[10px] sm:text-xs font-bold text-main uppercase tracking-wider">Desafíos</span>
            </div>
        </section>

        <!-- SECCIÓN DE ESTADÍSTICAS EN EL MÓVIL Y DESKTOP -->
        <section class="card-bg rounded-xl sm:rounded-3xl px-3 py-2 sm:px-6 sm:py-2.5 shadow-xs border border-main flex items-center justify-around shrink-0 h-14 sm:h-16 transition-colors mb-2">
            <div class="flex items-center gap-1.5 sm:gap-2">
                <div class="relative w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle-progress" stroke="#23483f" stroke-dasharray="100, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <span id="stat-words-learned" class="absolute text-[8px] sm:text-[10px] font-bold text-main">0</span>
                </div>
                <span class="text-[7px] sm:text-[10px] font-mono font-bold text-muted uppercase">Aprendidas</span>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-2">
                <div class="relative w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle-progress" stroke="#d4a373" stroke-dasharray="80, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <span id="stat-challenges-completed" class="absolute text-[8px] sm:text-[10px] font-bold text-main">0</span>
                </div>
                <span class="text-[7px] sm:text-[10px] font-mono font-bold text-muted uppercase">Desafíos</span>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-2">
                <div class="relative w-8 h-8 sm:w-10 sm:h-10 flex items-center justify-center">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path class="circle-progress" stroke="#e06a4e" stroke-dasharray="100, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    </svg>
                    <span id="stat-missions-completed" class="absolute text-[8px] sm:text-[10px] font-bold text-main">0</span>
                </div>
                <span class="text-[7px] sm:text-[10px] font-mono font-bold text-muted uppercase">Misiones</span>
            </div>
        </section>

    </main>

    <!-- FOOTER MÓVIL (ESTÁTICO FUERA DEL ÁREA SCROLL) -->
    <footer class="md:hidden card-bg border-t border-main py-2 w-full shrink-0 shadow-md z-30 transition-colors">
        <nav class="flex justify-around items-center">
            <button onclick="window.location.reload()" class="flex flex-col items-center text-main cursor-pointer">
                <div class="w-6 h-6 rounded-full flex items-center justify-center subcard-bg">
                    <i class="fa-solid fa-house text-xs"></i>
                </div>
                <span class="text-[7px] font-bold uppercase tracking-wider mt-0.5">INICIO</span>
            </button>

            <button onclick="window.openSpeakingManager()" class="flex flex-col items-center text-muted hover:text-main cursor-pointer">
                <div class="w-6 h-6 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-microphone text-xs"></i>
                </div>
                <span class="text-[7px] font-bold uppercase tracking-wider mt-0.5">SPEAKING</span>
            </button>

            <button onclick="window.toggleBottomSheetProfile()" class="flex flex-col items-center text-muted hover:text-main cursor-pointer">
                <div class="w-6 h-6 rounded-full flex items-center justify-center">
                    <i class="fa-solid fa-user text-xs"></i>
                </div>
                <span class="text-[7px] font-bold uppercase tracking-wider mt-0.5">CUENTA</span>
            </button>
        </nav>
    </footer>

    <!-- BOTTOM SHEET MÓVIL -->
    <div id="profile-bottom-sheet" class="fixed inset-0 bg-[#1e2623]/70 backdrop-blur-md z-50 flex flex-col justify-end opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="card-bg border-t border-main w-full rounded-t-3xl p-5 shadow-2xl flex flex-col gap-4 font-mono max-h-[85vh] overflow-y-auto transform translate-y-full transition-transform duration-300">
            
            <div class="flex justify-between items-center border-b border-main pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-base">🇺🇸</span>
                    <span class="text-xs font-bold text-main uppercase">// INGLÉS APRENDIENDO</span>
                </div>
                <button onclick="window.toggleBottomSheetProfile()" class="w-7 h-7 rounded-full subcard-bg text-main flex items-center justify-center text-xs">✕</button>
            </div>

            <div class="subcard-bg p-4 rounded-2xl border border-main flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#e06a4e] text-white flex items-center justify-center font-bold">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="flex flex-col">
                        <span id="sheet-student-name" class="text-xs font-bold text-main">Estudiante</span>
                        <span class="text-[9px] text-muted">Lukes Member</span>
                    </div>
                </div>
                <button onclick="window.MissionsEngine.renderLukesGoldCardModal()" class="text-[9px] bg-gradient-to-r from-amber-400 to-amber-600 text-stone-900 font-black px-2.5 py-1.5 rounded-xl uppercase shadow-xs">
                    Gold Card 💳
                </button>
            </div>

            <div class="flex items-center justify-between subcard-bg p-3.5 rounded-2xl border border-main">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-moon text-xs text-main"></i>
                    <span class="text-xs font-bold text-main">MODO OSCURO</span>
                </div>
                <button onclick="window.toggleDarkMode()" class="w-11 h-6 bg-[#e3dec3] dark:bg-[#e06a4e] rounded-full p-0.5 transition-colors cursor-pointer flex items-center">
                    <div class="w-5 h-5 bg-white rounded-full shadow-xs transform dark:translate-x-5 transition-transform"></div>
                </button>
            </div>

            <div class="flex flex-col gap-2 mt-2">
                <button onclick="window.ProgressManager.syncToSupabase(); window.showToast('¡Progreso guardado en la nube!', 'success');" class="w-full bg-[#23483f] text-white text-xs font-bold py-3 rounded-xl uppercase">
                    ☁️ Sincronizar Progreso
                </button>
                <button onclick="window.handleLogout()" class="w-full bg-rose-50 text-rose-600 dark:bg-rose-950/40 dark:text-rose-400 border border-rose-200 dark:border-rose-900 text-xs font-bold py-3 rounded-xl uppercase">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL AUTENTICACIÓN -->
    <div id="auth-modal" class="fixed inset-0 bg-[#1e2623]/70 backdrop-blur-md z-50 flex items-center justify-center p-4 font-sans opacity-0 pointer-events-none transition-opacity duration-300 select-none">
        <div class="card-bg border border-main text-main w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col gap-4 text-center relative transition-colors">
            <button onclick="window.closeAuthModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full subcard-bg text-muted flex items-center justify-center text-xs cursor-pointer transition-all">✕</button>

            <div>
                <span class="text-[9px] font-mono text-muted font-bold uppercase tracking-widest">// LUKES ENGLISH ACADEMY</span>
                <h2 id="auth-modal-title" class="title-brand font-black text-xl text-main uppercase tracking-tight mt-1">Iniciar Sesión</h2>
            </div>

            <div class="flex subcard-bg p-1 rounded-xl border border-main">
                <button id="tab-login-btn" onclick="window.switchAuthTab('login')" class="flex-1 py-1.5 rounded-lg text-xs font-mono font-bold transition-all card-bg text-main shadow-xs">Ingresar</button>
                <button id="tab-register-btn" onclick="window.switchAuthTab('register')" class="flex-1 py-1.5 rounded-lg text-xs font-mono font-bold transition-all text-muted">Registrarse</button>
            </div>

            <form id="auth-form" class="flex flex-col gap-3 text-left mt-1">
                <div id="field-name-group" class="hidden">
                    <label class="text-[10px] font-mono font-bold text-muted uppercase tracking-wider block mb-1">Nombre Completo:</label>
                    <input type="text" id="auth-name-input" placeholder="Tu nombre" class="w-full subcard-bg border border-main rounded-xl p-3 text-xs font-mono font-bold text-main focus:outline-none focus:border-[#e06a4e] transition-colors">
                </div>

                <div>
                    <label class="text-[10px] font-mono font-bold text-muted uppercase tracking-wider block mb-1">Correo Electrónico:</label>
                    <input type="email" id="auth-email-input" required placeholder="correo@ejemplo.com" class="w-full subcard-bg border border-main rounded-xl p-3 text-xs font-mono font-bold text-main focus:outline-none focus:border-[#e06a4e] transition-colors">
                </div>

                <div>
                    <label class="text-[10px] font-mono font-bold text-muted uppercase tracking-wider block mb-1">Contraseña:</label>
                    <input type="password" id="auth-password-input" required placeholder="••••••••" class="w-full subcard-bg border border-main rounded-xl p-3 text-xs font-mono font-bold text-main focus:outline-none focus:border-[#e06a4e] transition-colors">
                </div>

                <div id="field-confirm-group" class="hidden">
                    <label class="text-[10px] font-mono font-bold text-muted uppercase tracking-wider block mb-1">Confirmar Contraseña:</label>
                    <input type="password" id="auth-confirm-input" placeholder="••••••••" class="w-full subcard-bg border border-main rounded-xl p-3 text-xs font-mono font-bold text-main focus:outline-none focus:border-[#e06a4e] transition-colors">
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full bg-[#e06a4e] hover:bg-[#c8573b] text-white font-mono text-xs font-black py-3.5 rounded-xl uppercase tracking-widest cursor-pointer transition-all active:scale-95 shadow-md mt-2">
                    Ingresar a la Plataforma ➔
                </button>
            </form>
        </div>
    </div>

    <!-- CONTENEDOR DE EJERCICIOS -->
    <div id="lesson-interactive-deck" class="fixed inset-0 md:left-64 app-bg z-50 flex flex-col justify-between p-4 sm:p-6 overflow-hidden select-none hidden text-main"></div>

    <script type="module" src="./js/site.js"></script>
</body>
